name: Build APK

# ── 触发条件 ────────────────────────────────────────────────────────────────────
# • push tag v*.*.* → 构建签名 APK 并发布 GitHub Release
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 同一 ref 有新触发时取消旧的运行

permissions:
  contents: write   # release job 需要写权限创建 GitHub Release

# ── 全局：只构建 arm64-v8a ─────────────────────────────────────────────────────
env:
  BUILD_ABI: arm64-v8a
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 仅 arm64，缩短超时

    steps:
    # ── 1. Checkout ────────────────────────────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '1'          # 只拉最新一次提交，changelog 用 tag 范围查即可

    # ── 2. NDK（用 ndk-install action，比 sdkmanager 快约 1~2 min）─────────────
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r28b          # 28.2.x 对应 r28b
        add-to-path: false

    - name: Set NDK_HOME env
      run: |
        echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        # 写入 ndkVersion 到 build.gradle.kts（与旧逻辑一致）
        sed -i '10i\
        \
            ndkVersion = "${{ env.NDK_VERSION }}"' \
          ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    # ── 3. libtun2socks（仅 arm64-v8a，缓存 key 带 ABI）──────────────────────
    - name: Restore cached libtun2socks
      id: cache-libtun2socks-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libtun2socks-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.BUILD_ABI }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('.git/modules/badvpn/HEAD') }}-${{ hashFiles('.git/modules/libancillary/HEAD') }}-${{ hashFiles('compile-tun2socks.sh') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libtun2socks
      if: steps.cache-libtun2socks-restore.outputs.cache-hit != 'true'
      env:
        BUILD_ABI: ${{ env.BUILD_ABI }}
      run: bash compile-tun2socks.sh && bash compile-hevtun.sh
    
    - name: Save libtun2socks
      if: steps.cache-libtun2socks-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libtun2socks-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.BUILD_ABI }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('.git/modules/badvpn/HEAD') }}-${{ hashFiles('.git/modules/libancillary/HEAD') }}-${{ hashFiles('compile-tun2socks.sh') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libtun2socks
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    # ── 4. libv2ray AAR（直接下载，无需编译）──────────────────────────────────
    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.12
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: 'v25.12.2'
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    # ── 5. libhysteria2（仅 arm64-v8a，缓存 key 带 ABI）─────────────────────
    - name: Restore cached libhysteria2
      id: cache-libhysteria2-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/hysteria/libs
        key: libhysteria2-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.BUILD_ABI }}-${{ hashFiles('.git/modules/hysteria/HEAD') }}-${{ hashFiles('libhysteria2.sh') }}

    - name: Setup Golang
      if: steps.cache-libhysteria2-restore.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5.4.0
      with:
        go-version-file: 'AndroidLibXrayLite/go.mod'
        cache: false

    - name: Build libhysteria2
      if: steps.cache-libhysteria2-restore.outputs.cache-hit != 'true'
      env:
        BUILD_ABI: ${{ env.BUILD_ABI }}
      run: bash libhysteria2.sh

    - name: Save libhysteria2
      if: steps.cache-libhysteria2-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/hysteria/libs
        key: libhysteria2-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.BUILD_ABI }}-${{ hashFiles('.git/modules/hysteria/HEAD') }}-${{ hashFiles('libhysteria2.sh') }}

    - name: Copy libhysteria2
      run: cp -r ${{ github.workspace }}/hysteria/libs ${{ github.workspace }}/V2rayNG/app

    # ── 6. Java + Gradle 缓存 ─────────────────────────────────────────────────
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # ── 7. 解析版本号 ──────────────────────────────────────────────────────────
    - name: Extract version from tag
      id: version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"
        echo "tag=$TAG"         >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # ── 8. 签名 & 构建 ─────────────────────────────────────────────────────────
    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release.jks

    - name: Build APK (arm64-v8a, playstore)
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -PABI_FILTERS=${{ env.BUILD_ABI }} \
          --no-daemon \
          --build-cache \
          -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
    
    - name: Cleanup keystore
      if: always()
      run: rm -f $GITHUB_WORKSPACE/release.jks

    # ── 9. 整理产物 ────────────────────────────────────────────────────────────
    - name: Collect APK artifacts
      run: |
        mkdir -p artifacts
        find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release \
          -name "*arm64-v8a*.apk" | while read f; do
          cp "$f" "artifacts/$(basename "$f")"
        done
        ls -lh artifacts/

    # ── 10. Changelog（浅克隆下用 tag 范围）──────────────────────────────────
    - name: Fetch tags for changelog
      run: git fetch --tags --depth=100

    - name: Generate Changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
        else
          LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$LOG"           >> $GITHUB_OUTPUT
        echo "EOF"            >> $GITHUB_OUTPUT

    # ── 11. 发布 GitHub Release ────────────────────────────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.tag }}
        body: |
          ## 📦 v2rayNG ${{ steps.version.outputs.tag }}

          **Version:** `${{ steps.version.outputs.version }}`
          **Commit:** `${{ github.sha }}`

          ### 📋 What's Changed

          ${{ steps.changelog.outputs.changelog }}
        files: artifacts/*.apk
        draft: false
        prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
